version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -E '^(DATABASE_URL|NEXTAUTH_SECRET|SMTP_ENCRYPTION_KEY|APP_URL|NEXT_PUBLIC_)' > .env.production
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

